spring.application.name=Backend_BookMyHotel

# spring profiles
spring.profiles.active=dev
# spring.profiles.active=prod

# Multipart upload limits (increase to allow larger image uploads from admin UI)
# Max single file size (e.g. 10MB)
spring.servlet.multipart.max-file-size=10MB
# Max total request size (for requests that include multiple files)
spring.servlet.multipart.max-request-size=20MB

# Tomcat-specific: allow larger request bodies to be swallowed/consumed
# -1 disables the limit; set an upper bound if you prefer (value is bytes)
server.tomcat.max-swallow-size=20971520
