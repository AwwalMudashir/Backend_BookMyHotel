spring.application.name=pc_backend
server.port=${PORT:6767}
server.servlet.context-path=/api/v1

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

app.allowed.origins=${ALLOWED_ORIGINS}
frontend.base.url=${FRONTEND_BASE_URL}
app.email=${APP_EMAIL}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
eco.points.per-night=5

resend.api.key=${RESEND_API_KEY}
resend.email.from=${RESEND_EMAIL_FROM}
cloudinary_cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary_api_key=${CLOUDINARY_API_KEY}
cloudinary_api_secret=${CLOUDINARY_API_SECRET}
cloudinary_url=cloudinary://${CLOUDINARY_API_KEY}:${CLOUDINARY_API_SECRET}@${CLOUDINARY_CLOUD_NAME}
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20971520
logging.level.com.project=INFO
