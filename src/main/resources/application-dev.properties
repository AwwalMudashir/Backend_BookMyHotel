# Load local secrets with Spring Boot's built-in properties-file support.
spring.config.import=optional:file:.env[.properties]
spring.application.name=pc_backend
server.port=6767
server.servlet.contextPath=/api/v1

spring.datasource.url=jdbc:postgresql://localhost:5432/book_my_hotel
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true

app.email=${APP_EMAIL:}
app.allowed.origins=http://localhost:5173
frontend.base.url=http://localhost:5173

jwt.secret=${JWT_SECRET:local-development-only-secret-key-change-before-production-64-characters}
jwt.expiration=900000

# Future change for flyway
#spring.jpa.hibernate.ddl-auto=validate
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration

resend.api.key=${RESEND_API_KEY:}
resend.email.from=${RESEND_EMAIL_FROM:onboarding@resend.dev}

cloudinary_cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary_api_key=${CLOUDINARY_API_KEY:}
cloudinary_api_secret=${CLOUDINARY_API_SECRET:}

cloudinary_url=cloudinary://${CLOUDINARY_API_KEY:}:${CLOUDINARY_API_SECRET:}@${CLOUDINARY_CLOUD_NAME:}

# Stripe (test mode). Values come from environment variables, not hardcoded here, since a Stripe
# secret key can create charges/refunds on the account it belongs to. Set STRIPE_SECRET_KEY and
# STRIPE_WEBHOOK_SECRET in your shell/IDE run config/.env — see the setup guide for where to get them.
stripe.secret.key=${STRIPE_SECRET_KEY}
# stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Enable debug logging for application packages while diagnosing webhooks
logging.level.com.project=DEBUG

eco.points.per-night=5

# Local development: load the Google OAuth client ID from the shell or .env file.
# If the env var is not available, use the known local dev client ID.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:7664038745-3sltftg9g4qk1semm7nmh3e4csocfkcv.apps.googleusercontent.com}

# Multipart upload limits for local/dev environment
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20971520
